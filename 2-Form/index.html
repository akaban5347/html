<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="form">
      <h1 class="register">Регистрация</h1>
      <p class="text">Уже есть аккаунт?</p>
      <a class="link" href="#">Войти</a>
      <form action="#" method="post">
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Введите ваш логин"
        />
        <input type="text" id="name" placeholder="Имя" name="name" />
        <input type="text" id="surname" placeholder="Фамилия" name="surname" />
        <input type="email" id="email" placeholder="E-mail" name="email" />
        <label
          ><input type="checkbox" name="agree" required id="checkbox" /> Я
          прочитал и принимаю
          <a class="link-under" id="bottom-a" href="#"
            >Условия использования</a
          ></label
        >
        <button class="button" type="submit">Зарегистрироваться</button>
      </form>
    </main>
  </body>
</html>
